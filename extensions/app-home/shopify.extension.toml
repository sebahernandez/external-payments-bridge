api_version = "2026-07"

[[extensions]]
# Change the merchant-facing name of the extension in locales/en.default.json
name = "t:name"
handle = "app-home"
uid = "83247469-d4a8-2612-c903-5468f6914aaa918849e8"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/AppHome.jsx"
target = "admin.app.home.render"
assets = "./assets"

[extensions.capabilities]
# UI extensions run in a Web Worker with a null origin; this is required to
# fetch() our own backend (payment settings) from SettingsPage.jsx.
network_access = true
